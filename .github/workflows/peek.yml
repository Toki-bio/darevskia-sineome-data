name: peek at ENA fastq heads
on:
  push:
    branches: [actions/genotype]
    paths: ['.github/workflows/peek.yml']
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: layout of the combined ENA file (first 3 GB compressed)
        run: |
          u=https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR161/078/SRR16117178/SRR16117178.fastq.gz
          start=$(date +%s)
          (curl -sS --retry 10 -r 0-3000000000 "$u" || true) | (gzip -dc 2>/dev/null || true) | awk '
            NR%4==1 {split($0,a," "); tag=a[2]}
            NR%4==2 {n++; L=length($0); key=tag" len"(L>=50?">=50":"<50"); c[key]++
                     if (key!=prev) {print "record " n ": " $0 " (" tag ", " L " bp)"; prev=key}}
            END {print n " records"; for (k in c) print k, c[k]}'
          echo "took $(( $(date +%s) - start )) s"
      - name: NCBI copies
        run: |
          curl -sSI https://sra-pub-run-odp.s3.amazonaws.com/sra/SRR16117178/SRR16117178 | head -5 || true
          curl -s "https://trace.ncbi.nlm.nih.gov/Traces/sra-db-be/run_new?acc=SRR16117178" | head -c 1500; echo
          curl -s "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=sra&term=SRR16117178&usehistory=n" | head -c 300; echo
          curl -s "https://trace.ncbi.nlm.nih.gov/Traces/sra-db-be/runinfo?acc=SRR16117178" | head -3
