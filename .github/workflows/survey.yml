name: survey raw data
on:
  push:
    branches: [actions/survey]
  workflow_dispatch:
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SRA runs of the Darevskia projects and the genus
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import urllib.request, urllib.parse, time, csv, io, collections
          E = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/"
          def get(url):
              for i in range(4):
                  try:
                      return urllib.request.urlopen(url, timeout=120).read().decode()
                  except Exception as e:
                      err = e; time.sleep(5)
              return ""
          def runinfo(term):
              q = get(E + "esearch.fcgi?db=sra&usehistory=y&retmax=0&term=" + urllib.parse.quote(term))
              import re
              n = re.search(r"<Count>(\d+)</Count>", q); we = re.search(r"<WebEnv>(\S+)</WebEnv>", q); qk = re.search(r"<QueryKey>(\d+)</QueryKey>", q)
              if not n or n.group(1) == "0":
                  return []
              t = get(E + f"efetch.fcgi?db=sra&rettype=runinfo&retmode=text&query_key={qk.group(1)}&WebEnv={we.group(1)}")
              return [r for r in csv.DictReader(io.StringIO(t)) if r.get("Run")]
          cols = ["Run", "ScientificName", "BioProject", "BioSample", "SampleName", "Platform", "Model", "LibraryStrategy", "LibraryLayout", "bases", "size_MB", "ReleaseDate"]
          for term in ["PRJNA1029803", "PRJNA1022790", "PRJNA1022791", "SAMN37625718", "PRJNA327916"]:
              rows = runinfo(term)
              print(f"\n## SRA: {term} — {len(rows)} runs\n")
              if rows:
                  print("| " + " | ".join(cols) + " |\n|" + "---|" * len(cols))
                  for r in rows:
                      print("| " + " | ".join(str(r.get(c, "")) for c in cols) + " |")
          rows = runinfo("Darevskia[Organism]")
          c = collections.defaultdict(lambda: [0, 0, set()])
          for r in rows:
              k = (r["ScientificName"], r["Platform"], r["LibraryStrategy"])
              c[k][0] += 1; c[k][1] += int(r.get("bases") or 0); c[k][2].add(r["BioProject"])
          print(f"\n## SRA: all Darevskia — {len(rows)} runs\n")
          print("| species | platform | strategy | runs | Gbp | projects |\n|---|---|---|---|---|---|")
          for k, (n, b, p) in sorted(c.items()):
              print(f"| {' | '.join(k)} | {n} | {b/1e9:.1f} | {', '.join(sorted(p))[:80]} |")
          PY
